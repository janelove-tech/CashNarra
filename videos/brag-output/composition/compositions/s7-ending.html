      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // back to her — calmer, wider, warmer
          tl.fromTo("#s7-photo", { scale: 1.0, y: 0 }, { scale: 1.05, y: -10, duration: 4.6, ease: "sine.out" }, 0);
          tl.fromTo("#s7-warm", { opacity: 0 }, { opacity: 1, duration: 2.0, ease: "sine.out" }, 0.2);
          tl.fromTo("#s7-l1", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 2.0);
          tl.fromTo("#s7-l2", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 2.4);
          // settle into the brand plate (~53.2s) and hold to the end
          tl.fromTo("#s7-plate", { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.inOut" }, 3.75); // beat-locked: plate lands 53.15s on the resolving Dmaj9 (53.0s) + bell (53.2s)

          (function () {
            const M = window.CN_MUSIC, el = document.getElementById("s7-react"), px = { t: 0 };
            if (!M || !el) return;
            tl.fromTo(px, { t: 0 }, { t: 10.4, duration: 10.4, ease: "none", onUpdate: () => {
              const i = Math.min(M.energy.length - 1, Math.round((49.4 + px.t) * M.fps));
              el.style.opacity = (0.55 + 0.45 * Math.min(1, M.energy[i] * 3)).toFixed(3);
            } }, 0);
          })();
          window.__timelines["s7-ending"] = tl;
        })();
