      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const K = 940 / 390; // css px -> film px inside the window
          const show = (id, at, y0, from) => {
            tl.set("#s4-win .layer", { opacity: 0 }, at);
            tl.fromTo(id, { opacity: 1, y: -y0 * K + (from || 0) }, { opacity: 1, y: -y0 * K, duration: from ? 0.45 : 0.01, ease: "power3.out", immediateRender: false }, at);
          };
          // tap = touch dot moves in, presses, ripples (cursor-click-ripple, touch variant)
          const tap = (x, y, at) => {
            tl.fromTo("#s4-touch", { x: x - 38 + 60, y: y - 38 + 90, opacity: 0, scale: 1 },
              { x: x - 38, y: y - 38, opacity: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, at - 0.34);
            tl.to("#s4-touch", { scale: 0.78, duration: 0.09, ease: "power2.in" }, at);
            tl.to("#s4-touch", { scale: 1, opacity: 0, duration: 0.3, ease: "power2.out" }, at + 0.09);
            tl.fromTo("#s4-ring", { x: x - 38, y: y - 38, scale: 0.6, opacity: 0.9 },
              { scale: 2.4, opacity: 0, duration: 0.55, ease: "power2.out", immediateRender: false }, at + 0.04);
          };
          tl.fromTo("#s4-win", { scale: 1.04, y: 30 }, { scale: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
          // 1 — the story as typed (complete example) → Understand my story
          show("#s4-type", 0, 400);
          tap(540, 1330, 0.4);
          // 2 — CashNarra asks for the missing account
          show("#s4-clar", 0.72, 228, 50);
          // the question that needs her answer: slow push + focus frame on "Which account paid for delivery?"
          tl.fromTo("#s4-win", { scale: 1 }, { scale: 1.025, duration: 3.9, ease: "sine.inOut", immediateRender: false }, 0.9);
          tl.fromTo("#s4-focus", { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 1.7);
          tl.to("#s4-focus", { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 2.4);
          tl.to("#s4-focus", { opacity: 1, duration: 1.0, ease: "sine.inOut" }, 3.6);
          tl.to("#s4-focus", { opacity: 0, duration: 0.25, ease: "power1.in" }, 4.75);
          tl.to("#s4-win", { scale: 1, duration: 0.4, ease: "power2.out" }, 4.8);
          // 3 — the owner chooses MoMo, then reviews
          tap(540, 1039, 5.0);
          show("#s4-momo", 5.1, 228);
          tap(540, 1335, 5.6);
          show("#s4-rev", 5.72, 228, 60);
          for (let i = 1; i <= 8; i++) {
            tl.fromTo("#s4-b" + i, { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.out" }, 6.0 + i * 0.06);
          }
          tl.to("#s4-rev", { y: -809 * K, duration: 1.45, ease: "power2.inOut" }, 6.25);
          // 4 — save the batch
          tap(540, 1299, 7.85);
          show("#s4-saved", 8.15, 300, 40); // beat-locked: 28.75s ≈ saved chime 28.8s
          window.__timelines["s4-review"] = tl;
        })();
      </script>
