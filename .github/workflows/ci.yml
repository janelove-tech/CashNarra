name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: cashnarra_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashnarra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SITE_URL: http://127.0.0.1:3100
      TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@127.0.0.1:55432/cashnarra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build

  browser-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: http://127.0.0.1:3100
      DEMO_ENABLED: "true"
      AI_ENABLED: "false"
      VOICE_ENABLED: "false"
      VOICE_QUALITY_APPROVED: "false"
      CASHNARRA_CI_BROWSER_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test browser recovery, payment entry, export scope and Records context
        run: npx playwright test tests/e2e/public-sample.spec.ts tests/e2e/experience-recovery.spec.ts tests/e2e/security-boundaries.spec.ts tests/e2e/payment-export-context.spec.ts
      - name: Report remaining release gates
        if: always()
        run: |
          echo '### CashNarra release verification scope' >> "$GITHUB_STEP_SUMMARY"
          echo '- Browser smoke: public example, synthetic recovery, origin checks, payment entry, export scope and Records context (see job result).' >> "$GITHUB_STEP_SUMMARY"
          echo '- Supabase Auth/RLS service integration: NOT RUN by this job (requires isolated local Supabase).' >> "$GITHUB_STEP_SUMMARY"
          echo '- Physical Android, human screen reader and representative voice: EXTERNAL.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phase 08 remains INCOMPLETE; Phase 09 remains EXTERNAL.' >> "$GITHUB_STEP_SUMMARY"
