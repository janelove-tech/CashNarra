name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: cashnarra_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cashnarra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SITE_URL: http://127.0.0.1:3100
      TEST_DATABASE_URL: postgres://postgres:synthetic-test-only@127.0.0.1:55432/cashnarra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:db
      - run: npm run build
