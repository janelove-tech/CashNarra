<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("assets/fonts/ManropeVariable.ttf") format("truetype"); font-weight: 200 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
        #s6-ending { position: absolute; inset: 0; overflow: hidden; background: #29263d; font-family: "Inter", sans-serif; }
        #s6-ending .photo { position: absolute; left: -871px; top: 595px; width: 2074px; height: 1382px; transform-origin: 1431px 405px;
          background: url("assets/img/campaign-studio.png") 0 0 / 100% 100% no-repeat; will-change: transform; }
        #s6-ending .topfade { position: absolute; left: 0; top: 480px; width: 1080px; height: 460px;
          background: linear-gradient(180deg, #29263d 0%, #29263d 30%, rgba(41,38,61,0.8) 48%, rgba(41,38,61,0.36) 74%, rgba(41,38,61,0) 100%); }
        #s6-ending .warm { position: absolute; left: 280px; top: 640px; width: 1100px; height: 1100px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,196,160,0.22) 0%, rgba(255,196,160,0) 65%); }
        #s6-ending .vignette { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 64%, rgba(25,23,35,0) 50%, rgba(25,23,35,0.6) 100%); }
        #s6-ending .line { position: absolute; left: 80px; top: 200px; width: 920px; font-family: "Manrope", sans-serif; font-weight: 800;
          font-size: 96px; line-height: 1.0; letter-spacing: -0.035em; color: #ffffff; }
        #s6-ending .line div { display: block; opacity: 0; }
        #s6-ending .line .l3 { color: #ffc4a0; }
        #s6-ending .plate { position: absolute; inset: 0; background: #29263d; opacity: 0; }
        #s6-ending .plate .glow { position: absolute; left: 40px; top: 420px; width: 1000px; height: 1000px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,196,160,0.2) 0%, rgba(255,196,160,0) 62%); opacity: 0.6; }
        #s6-ending .lockup { position: absolute; left: 230px; top: 700px; width: 620px; height: 124px; opacity: 0; }
        #s6-ending .lockup img { display: block; width: 100%; height: 100%; }
        #s6-ending .tag { position: absolute; left: 80px; top: 880px; width: 920px; text-align: center; font-weight: 500; font-size: 44px;
          line-height: 1.3; color: #f6f3fb; opacity: 0; }
        #s6-ending .modes { position: absolute; left: 80px; top: 960px; width: 920px; text-align: center; font-weight: 500; font-size: 30px; color: #d9d4e9; opacity: 0; }
        #s6-ending .soon { position: absolute; left: 0; top: 1050px; width: 1080px; display: flex; justify-content: center; opacity: 0; }
        #s6-ending .soon span { display: block; padding: 18px 40px; border-radius: 999px; background: #ffc4a0; color: #29263d; font-weight: 700; font-size: 38px; }
        #s6-ending .fine { position: absolute; left: 80px; top: 1250px; width: 920px; text-align: center; font-weight: 500; font-size: 24px; color: #c1bbce; opacity: 0; }
      </style>
      <div id="s6-ending" data-composition-id="s6-ending" data-width="1080" data-height="1920">
        <div class="photo" id="s6-photo"></div>
        <div class="topfade"></div>
        <div class="warm" id="s6-warm"></div>
        <div class="vignette"></div>
        <div class="line"><div id="s6-l1">MY DAY.</div><div id="s6-l2">MY WORDS.</div><div class="l3" id="s6-l3">MY NUMBERS.</div></div>
        <div class="plate" id="s6-plate">
          <div class="glow" id="s6-react"></div>
          <div class="lockup" id="s6-lockup"><img src="assets/brand/cashnarra-lockup-reversed.svg" alt="CashNarra" /></div>
          <div class="tag" id="s6-tag">Tell Your Money Story. See the Numbers.</div>
          <div class="modes" id="s6-modes">Say it or type it — in your own words.</div>
          <div class="soon" id="s6-soon"><span>Coming soon</span></div>
          <div class="fine" id="s6-fine">Illustrative story · AI-generated fictional character · product in development · voice capture is a design preview</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s6-photo", { scale: 1.0, y: 0 }, { scale: 1.05, y: -10, duration: 3.4, ease: "sine.out" }, 0);
          tl.fromTo("#s6-warm", { opacity: 0 }, { opacity: 1, duration: 1.8, ease: "sine.out" }, 0.1);
          [["#s6-l1", 0.3], ["#s6-l2", 1.0], ["#s6-l3", 1.75]].forEach(([id, at]) =>
            tl.fromTo(id, { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, at));
          // beat-locked: plate lands 55.4s on the score's F-major resolve + boom
          tl.fromTo("#s6-plate", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.inOut" }, 2.7);
          tl.fromTo("#s6-lockup", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 2.85);
          tl.fromTo("#s6-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 3.15);
          tl.fromTo("#s6-modes", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 3.6);
          tl.fromTo("#s6-fine", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 3.8);
          tl.fromTo("#s6-soon", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 5.55);
          // audio-reactive (subtle): plate glow breathes with the final chord
          (function () {
            const A = window.CN_AUDIO, el = document.getElementById("s6-react"), px = { t: 0 };
            if (!A || !el) return;
            tl.fromTo(px, { t: 0 }, { t: 7.2, duration: 7.2, ease: "none", onUpdate: () => {
              const i = Math.min(A.score.length - 1, Math.round((52.6 + px.t) * A.fps));
              el.style.opacity = (0.45 + 0.55 * Math.min(1, A.score[i] * 1.6)).toFixed(3);
            } }, 0);
          })();
          window.__timelines["s6-ending"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
