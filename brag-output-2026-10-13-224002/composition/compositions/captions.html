<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
        @font-face { font-family: "Manrope"; src: url("assets/fonts/ManropeVariable.ttf") format("truetype"); font-weight: 200 800; }
        #captions { position: absolute; inset: 0; font-family: "Inter", sans-serif; }
        #captions .cap { position: absolute; left: 70px; right: 70px; bottom: 350px; display: flex; justify-content: center; }
        #captions .cap span { display: block; max-width: 940px; padding: 14px 28px 16px; border-radius: 18px; background: rgba(28, 26, 42, 0.86);
          color: #ffffff; font-weight: 600; font-size: 44px; line-height: 1.24; text-align: center; letter-spacing: -0.005em; }
      </style>
      <div id="captions" data-composition-id="captions" data-width="1080" data-height="1920">
        <div id="cap-01" class="clip cap" data-start="0.65" data-duration="4.29" data-track-index="0"><span>Every evening, before I lock up, I tell my phone how the day went.</span></div>
        <div id="cap-02" class="clip cap" data-start="23.55" data-duration="2.67" data-track-index="0"><span>No forms. No accounting words.</span></div>
        <div id="cap-03" class="clip cap" data-start="26.25" data-duration="3.3" data-track-index="0"><span>Busy with a customer? I type it as it happens.</span></div>
        <div id="cap-04" class="clip cap" data-start="30.65" data-duration="2.77" data-track-index="0"><span>CashNarra turns my words into records.</span></div>
        <div id="cap-05" class="clip cap" data-start="33.45" data-duration="3.62" data-track-index="0"><span>It asks what I left out. Which account paid for delivery?</span></div>
        <div id="cap-06" class="clip cap" data-start="37.1" data-duration="3.36" data-track-index="0"><span>MoMo. I check all eight, and I save.</span></div>
        <div id="cap-07" class="clip cap" data-start="41.25" data-duration="4.17" data-track-index="0"><span>Abena’s GH₵200 is not a new sale. She owes GH₵400 now.</span></div>
        <div id="cap-08" class="clip cap" data-start="45.45" data-duration="2.07" data-track-index="0"><span>Kojo still owes GH₵300.</span></div>
        <div id="cap-09" class="clip cap" data-start="47.55" data-duration="4.38" data-track-index="0"><span>GH₵2,300 came in. GH₵930 went out.</span></div>
        <div id="cap-10" class="clip cap" data-start="52.85" data-duration="2.67" data-track-index="0"><span>My day. My words. My numbers.</span></div>
        <div id="cap-11" class="clip cap" data-start="55.55" data-duration="2.57" data-track-index="0"><span>Tell your money story. See the numbers.</span></div>
        <div id="cap-12" class="clip cap" data-start="58.15" data-duration="1.39" data-track-index="0"><span>Coming soon.</span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          document.querySelectorAll("#captions .cap").forEach((clip) => {
            tl.fromTo(clip.querySelector("span"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, parseFloat(clip.dataset.start));
          });
          window.__timelines["captions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
