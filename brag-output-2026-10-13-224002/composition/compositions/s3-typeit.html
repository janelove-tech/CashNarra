<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("assets/fonts/ManropeVariable.ttf") format("truetype"); font-weight: 200 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
        #s3-typeit { position: absolute; inset: 0; overflow: hidden; background: #29263d; font-family: "Inter", sans-serif; }
        #s3-typeit .react { position: absolute; left: 90px; top: 520px; width: 900px; height: 900px; border-radius: 50%; opacity: 0;
          background: radial-gradient(circle, rgba(255,196,160,0.3) 0%, rgba(255,196,160,0.08) 42%, rgba(255,196,160,0) 70%); }
        #s3-typeit .head { position: absolute; left: 80px; top: 186px; font-family: "Manrope", sans-serif; font-weight: 800; font-size: 76px;
          line-height: 1.08; letter-spacing: -0.035em; }
        #s3-typeit .head div { display: block; }
        #s3-typeit .h1 { color: #ffffff; }
        #s3-typeit .h2 { color: #ffc4a0; opacity: 0; }
        #s3-typeit .device { position: absolute; left: 272px; top: 451px; width: 536px; height: 1118px; border-radius: 70px; background: #15131f;
          padding: 18px; box-shadow: 0 40px 120px rgba(10,8,20,0.6), inset 0 0 0 2px rgba(255,255,255,0.08); will-change: transform; }
        #s3-typeit .screen { position: relative; width: 500px; height: 1082px; border-radius: 54px; overflow: hidden; background: #f7f7fa; }
        #s3-typeit .screen img.sc { display: block; }
        #s3-typeit .screen .sc { position: absolute; left: 0; top: 0; width: 500px; height: 1082px; opacity: 0;
          background-size: 500px 1082px; background-repeat: no-repeat; }
        #s3-typeit .chip { position: absolute; left: 640px; top: 860px; padding: 12px 22px; border-radius: 14px; background: #ffc4a0; color: #29263d;
          font-weight: 700; font-size: 28px; opacity: 0; }
        #s3-typeit .paper { position: absolute; inset: 0; background: #f7f7fa; opacity: 0; }
      </style>
      <div id="s3-typeit" data-composition-id="s3-typeit" data-width="1080" data-height="1920">
        <div class="react" id="s3-react"></div>
        <div class="head"><div class="h1" id="s3-h1">SAY IT.</div><div class="h2" id="s3-h2">OR TYPE IT.</div></div>
        <div class="device" id="s3-device">
          <div class="screen">
            <div class="sc" id="s3-voice" style="background-image: url('assets/ui/voice.png'); opacity: 1"></div>
            <div class="sc" id="s3-final" style="background-image: url('assets/ui/type_28.png')"></div>
            <div class="sc" id="s3-t00" style="background-image: url('assets/ui/type_00.png')"></div>
            <img class="sc" id="s3-t01" src="assets/ui/type_01.png" alt="" />
            <img class="sc" id="s3-t02" src="assets/ui/type_02.png" alt="" />
            <img class="sc" id="s3-t03" src="assets/ui/type_03.png" alt="" />
            <img class="sc" id="s3-t04" src="assets/ui/type_04.png" alt="" />
            <img class="sc" id="s3-t05" src="assets/ui/type_05.png" alt="" />
            <img class="sc" id="s3-t06" src="assets/ui/type_06.png" alt="" />
            <img class="sc" id="s3-t07" src="assets/ui/type_07.png" alt="" />
            <img class="sc" id="s3-t08" src="assets/ui/type_08.png" alt="" />
            <img class="sc" id="s3-t09" src="assets/ui/type_09.png" alt="" />
            <img class="sc" id="s3-t10" src="assets/ui/type_10.png" alt="" />
            <img class="sc" id="s3-t11" src="assets/ui/type_11.png" alt="" />
            <img class="sc" id="s3-t12" src="assets/ui/type_12.png" alt="" />
            <img class="sc" id="s3-t13" src="assets/ui/type_13.png" alt="" />
            <img class="sc" id="s3-t14" src="assets/ui/type_14.png" alt="" />
            <img class="sc" id="s3-t15" src="assets/ui/type_15.png" alt="" />
            <img class="sc" id="s3-t16" src="assets/ui/type_16.png" alt="" />
            <img class="sc" id="s3-t17" src="assets/ui/type_17.png" alt="" />
            <img class="sc" id="s3-t18" src="assets/ui/type_18.png" alt="" />
            <img class="sc" id="s3-t19" src="assets/ui/type_19.png" alt="" />
            <img class="sc" id="s3-t20" src="assets/ui/type_20.png" alt="" />
            <img class="sc" id="s3-t21" src="assets/ui/type_21.png" alt="" />
            <img class="sc" id="s3-t22" src="assets/ui/type_22.png" alt="" />
            <img class="sc" id="s3-t23" src="assets/ui/type_23.png" alt="" />
            <img class="sc" id="s3-t24" src="assets/ui/type_24.png" alt="" />
            <img class="sc" id="s3-t25" src="assets/ui/type_25.png" alt="" />
            <img class="sc" id="s3-t26" src="assets/ui/type_26.png" alt="" />
            <img class="sc" id="s3-t27" src="assets/ui/type_27.png" alt="" />
            <img class="sc" id="s3-t28" src="assets/ui/type_28.png" alt="" />
          </div>
        </div>
        <div class="chip" id="s3-chip">Editable transcript</div>
        <div class="paper" id="s3-paper"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // typing flip-book: the real composer, typed stage by stage (complete example, delivery account omitted)
          // the voice note becomes an editable transcript in the composer
          tl.fromTo("#s3-device", { y: 380, scale: 0.34 }, { y: -20, scale: 0.8, duration: 0.75, ease: "power3.inOut" }, 0);
          tl.fromTo("#s3-final", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.inOut" }, 0.3);
          tl.fromTo("#s3-chip", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.95);
          tl.to("#s3-chip", { opacity: 0, duration: 0.25 }, 2.6);
          // "Busy with a customer? I type it as it happens."
          tl.fromTo("#s3-h2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.9);
          tl.set("#s3-t00", { opacity: 1 }, 2.95);
          for (let i = 1; i <= 28; i++) tl.set("#s3-t" + String(i).padStart(2, "0"), { opacity: 1 }, 3.1 + i * 0.1);
          // hand-off to the paper interface
          tl.to("#s3-device", { scale: 2.6, y: 60, duration: 0.5, ease: "power2.in" }, 6.42);
          tl.to(["#s3-h1", "#s3-h2"], { opacity: 0, duration: 0.25 }, 6.42);
          tl.fromTo("#s3-paper", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.in" }, 6.65);
          // audio-reactive (subtle): the glow breathes with the strings entering — read by timeline time, seek-safe
          (function () {
            const A = window.CN_AUDIO, el = document.getElementById("s3-react"), px = { t: 0 };
            if (!A || !el) return;
            tl.fromTo(px, { t: 0 }, { t: 7.0, duration: 7.0, ease: "none", onUpdate: () => {
              const i = Math.min(A.score.length - 1, Math.round((23.4 + px.t) * A.fps));
              el.style.opacity = (0.15 + 0.85 * Math.min(1, A.score[i] * 1.6)).toFixed(3);
            } }, 0);
          })();
          window.__timelines["s3-typeit"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
