<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Manrope"; src: url("assets/fonts/ManropeVariable.ttf") format("truetype"); font-weight: 200 800; }
        @font-face { font-family: "Inter"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; }
        #s1-evening { position: absolute; inset: 0; overflow: hidden; background: #29263d; font-family: "Inter", sans-serif; }
        #s1-evening .photo { position: absolute; left: -871px; top: 595px; width: 2074px; height: 1382px; transform-origin: 1431px 405px;
          background: url("assets/img/campaign-studio.png") 0 0 / 100% 100% no-repeat; will-change: transform; }
        #s1-evening .topfade { position: absolute; left: 0; top: 480px; width: 1080px; height: 460px;
          background: linear-gradient(180deg, #29263d 0%, #29263d 30%, rgba(41,38,61,0.8) 48%, rgba(41,38,61,0.36) 74%, rgba(41,38,61,0) 100%); }
        #s1-evening .vignette { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 64%, rgba(25,23,35,0) 46%, rgba(25,23,35,0.7) 100%); }
        #s1-evening .dim { position: absolute; inset: 0; background: #191723; }
        #s1-evening .type { position: absolute; left: 80px; top: 230px; width: 920px; font-family: "Manrope", sans-serif; font-weight: 800;
          font-size: 92px; line-height: 1.02; letter-spacing: -0.035em; color: #ffffff; }
        #s1-evening .type div { display: block; opacity: 0; }
        #s1-evening .type .l2 { color: #ffc4a0; }
        #s1-evening .device { position: absolute; left: 272px; top: 451px; width: 536px; height: 1118px; border-radius: 70px; background: #15131f;
          padding: 18px; box-shadow: 0 40px 120px rgba(10,8,20,0.6), inset 0 0 0 2px rgba(255,255,255,0.08); opacity: 0; will-change: transform; }
        #s1-evening .screen { width: 500px; height: 1082px; border-radius: 54px; overflow: hidden;
          background: #f7f7fa url("assets/ui/voice.png") 0 0 / 500px 1082px no-repeat; }
      </style>
      <div id="s1-evening" data-composition-id="s1-evening" data-width="1080" data-height="1920">
        <div class="photo" id="s1-photo"></div>
        <div class="topfade"></div>
        <div class="vignette"></div>
        <div class="dim" id="s1-dim"></div>
        <div class="type"><div id="s1-l1">CLOSING TIME.</div><div class="l2" id="s1-l2">IN MY OWN WORDS.</div></div>
        <div class="device" id="s1-device"><div class="screen"></div></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s1-photo", { scale: 1.02, y: 0 }, { scale: 1.12, y: -16, duration: 5.2, ease: "sine.inOut" }, 0);
          tl.fromTo("#s1-dim", { opacity: 0.6 }, { opacity: 0.1, duration: 1.4, ease: "power2.out" }, 0.05);
          tl.fromTo("#s1-l1", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.6);
          tl.fromTo("#s1-l2", { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.7);
          // she opens the voice note — the app's real voice screen rises into frame
          tl.to("#s1-dim", { opacity: 0.62, duration: 0.9, ease: "power2.inOut" }, 3.2);
          tl.to(["#s1-l1", "#s1-l2"], { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" }, 3.3);
          tl.fromTo("#s1-device", { opacity: 0, y: 300, scale: 0.8 }, { opacity: 1, y: 0, scale: 0.86, duration: 1.1, ease: "power3.out" }, 3.4);
          window.__timelines["s1-evening"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
