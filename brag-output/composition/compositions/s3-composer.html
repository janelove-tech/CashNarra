      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // MATCH CUT: the device opens exactly where her phone was in the last portrait frame, then straightens up
          tl.fromTo("#s3-device", { x: 54, y: 11, rotation: 24.5, scale: 0.4 },
            { x: 0, y: 0, rotation: 0, scale: 1, duration: 1.25, ease: "power3.inOut" }, 0.08);
          tl.fromTo("#s3-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.6, ease: "sine.out" }, 0.4);
          tl.to("#s3-glow", { scale: 1.08, duration: 3.8, ease: "sine.inOut" }, 2.0);
          // the scattered pieces drift around the new home for them
          const chips = ["#s3-c1", "#s3-c2", "#s3-c3", "#s3-c4", "#s3-c5", "#s3-c6"];
          // converge on the textarea centre (540, 1068)
          const target = [[388, 477], [-385, 397], [388, 177], [-384, 97], [350, -123], [-358, -203]];
          chips.forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, y: 20, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.7 + i * 0.09);
            tl.to(c, { y: (i % 2 ? 1 : -1) * 14, duration: 2.6, ease: "sine.inOut" }, 1.25 + i * 0.09);
            tl.to(c, { x: target[i][0], y: target[i][1], scale: 0.35, opacity: 0, duration: 0.62, ease: "power2.in" }, 4.32 + i * 0.03);
          });
          // "Meet CashNarra."
          tl.fromTo("#s3-lockup", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.55, ease: "power2.out" }, 2.82); // beat-locked: 16.82s ≈ score bell at 16.85s ("Meet CashNarra")
          tl.to("#s3-lockup", { opacity: 0, y: -12, duration: 0.35, ease: "power2.in" }, 4.05);
          // "Your money. In your words."
          tl.fromTo("#s3-h1", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.3);
          tl.fromTo("#s3-h2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.48);
          // TEXT ENTRY: the complete canonical example (delivery account omitted), captured stage by stage from the real composer
          for (let i = 1; i <= 28; i++) {
            tl.set("#s3-t" + String(i).padStart(2, "0"), { opacity: 1 }, 4.52 + i * 0.066);
          }
          tl.fromTo("#s3-excerpt", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.25);
          // hand-off to the paper interface
          tl.to("#s3-device", { scale: 2.6, y: 60, duration: 0.5, ease: "power2.in" }, 6.12);
          tl.to(["#s3-excerpt", "#s3-h1", "#s3-h2"], { opacity: 0, duration: 0.25, ease: "power1.in" }, 6.12);
          tl.fromTo("#s3-paper", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.in" }, 6.3);
          // audio-reactive (subtle): the glow breathes with the score's warmth — read from window.CN_MUSIC by timeline time, seek-safe
          (function () {
            const M = window.CN_MUSIC, el = document.getElementById("s3-react"), px = { t: 0 };
            if (!M || !el) return;
            tl.fromTo(px, { t: 0 }, { t: 6.6, duration: 6.6, ease: "none", onUpdate: () => {
              const i = Math.min(M.energy.length - 1, Math.round((14.0 + px.t) * M.fps));
              el.style.opacity = (0.1 + 0.9 * Math.min(1, M.energy[i] * 3)).toFixed(3);
            } }, 0);
          })();
          window.__timelines["s3-composer"] = tl;
        })();
      </script>
